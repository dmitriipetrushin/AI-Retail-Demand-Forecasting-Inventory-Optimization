[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intelligence"
version = "1.0.0"
description = "Local retail forecasting and simulated inventory decision support"
requires-python = ">=3.11"
authors = [{name = "Dmitry Petrushin"}]
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["src", "scripts"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: real data or model integration tests"]
