name: Reproduce and validate
on: [push, pull_request, workflow_dispatch]
jobs:
  local-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m scripts.download_data
      - run: python -m scripts.prepare_data
      - run: python -m scripts.train_models
      - run: python -m scripts.run_evaluation
      - run: python -m scripts.run_simulation
      - run: python -m scripts.generate_reports
      - run: python -m pytest --junitxml=reports/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            reports/test-results.xml
            reports/data-quality-summary.json
            reports/simulation-summary.csv
